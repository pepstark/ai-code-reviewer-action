name: 'AI Code Reviewer'
description: 'Critiques incoming pull requests against developer-specific historical anti-patterns.'
author: 'Seshanth Sathish'
inputs:
  github_token:
    description: 'GitHub Token for posting PR comments (secrets.GITHUB_TOKEN)'
    required: true
  gemini_api_key:
    description: 'Google Gemini API Key'
    required: false
  db_path:
    description: 'Relative path to localized SQLite database'
    required: false
    default: 'reviewer.db'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install requests google-generativeai
    - name: Run Review Engine
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        SESH_GEMINI_BABA_KEY: ${{ env.SESH_GEMINI_BABA_KEY }}
        DB_PATH: ${{ inputs.db_path }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
      run: python src/main.py
